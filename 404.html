<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Jeffery Asare</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#111;--bg:#fff;--warm:#f5f2ee;--muted:#999;
  --title:'General Sans',system-ui,sans-serif;
  --sans:'General Sans',system-ui,sans-serif;
}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-weight:400;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;padding:2rem;text-align:center;
}
.logo{
  font-family:var(--title);font-size:1.1rem;font-weight:600;
  letter-spacing:-.02em;margin-bottom:4rem;opacity:.4;
  text-decoration:none;color:var(--ink);
}
.num{
  font-family:var(--title);font-size:clamp(6rem,18vw,12rem);
  font-weight:600;line-height:1;letter-spacing:-.05em;
  color:var(--warm);margin-bottom:1.5rem;
  user-select:none;
}
.headline{
  font-family:var(--title);font-size:clamp(1.4rem,3vw,2rem);
  font-weight:600;letter-spacing:-.02em;margin-bottom:.8rem;
}
.sub{
  font-size:13px;color:var(--muted);line-height:1.8;
  max-width:340px;margin:0 auto 2.5rem;
}
.links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
.btn{
  display:inline-block;text-decoration:none;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:500;padding:.75rem 1.6rem;border-radius:999px;
  transition:opacity .2s;
}
.btn:hover{opacity:.7;}
.btn-dark{background:var(--ink);color:#fff;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
</style>
</head>
<body>
  <a class="logo" href="/">ja.</a>
  <div class="num">404</div>
  <h1 class="headline">Nothing here.</h1>
  <p class="sub">This page doesn't exist — or it moved. Either way, there's more worth looking at back where you came from.</p>
  <div class="links">
    <a class="btn btn-dark" href="/">Go home</a>
    <a class="btn btn-outline" href="/?page=portfolio">View portfolio</a>
  </div>
</body>
</html>
